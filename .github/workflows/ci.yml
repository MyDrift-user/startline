name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: cargo test --release --locked
      - name: Policy templates are up to date
        shell: pwsh
        run: |
          # The program writes them from its own list of policies, so the copies here must match what it writes.
          # It's a windowed program, so wait for it explicitly.
          $p = Start-Process target\release\startline.exe -ArgumentList '--write-policy-templates', "`"$env:RUNNER_TEMP\policy`"" -Wait -PassThru
          if ($p.ExitCode) { throw "Writing the policy templates failed: $($p.ExitCode)" }
          foreach ($file in 'Startline.admx', 'en-US\Startline.adml') {
            $here = (Get-Content "PolicyDefinitions\$file" -Raw) -replace "`r"
            $written = (Get-Content "$env:RUNNER_TEMP\policy\$file" -Raw) -replace "`r"
            if ($here -ne $written) {
              throw "PolicyDefinitions\$file is out of date: run startline.exe --write-policy-templates PolicyDefinitions"
            }
          }
