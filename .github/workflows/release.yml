name: Release

# Started by hand: Actions -> Release -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, to check it's the one in Cargo.toml (empty: use Cargo.toml's)"
        required: false
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false
      publish:
        description: "Publish the release (off: only build and test, files stay on the run)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        shell: pwsh
        env:
          WANTED: ${{ inputs.version }}
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($env:WANTED -and $v -ne $env:WANTED) { throw "Cargo.toml says $v, the input says $env:WANTED" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build and test
        run: |
          cargo build --release --locked
          cargo test --release --locked

      - name: Install installer tools
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          dotnet tool install --global wix --version 5.0.2
          $env:DOTNET_ROLL_FORWARD = 'Major'
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add --global WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE) { throw "wix extension failed" }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build installers and portable files
        shell: pwsh
        env:
          DOTNET_ROLL_FORWARD: Major
        run: installer\windows\package.ps1

      - name: Test installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $base = "startline-v$env:VERSION-windows-x64"
          $exe = "$env:ProgramFiles\Startline\startline.exe"
          # The installed program has to run. Writing the policy templates is the one thing it does and then exits.
          function Assert-Runs($program) {
            $p = Start-Process $program -ArgumentList '--write-policy-templates', "`"$env:RUNNER_TEMP\runs`"" -Wait -PassThru
            if ($p.ExitCode -or -not (Test-Path "$env:RUNNER_TEMP\runs\Startline.admx")) { throw "$program doesn't run: $($p.ExitCode)" }
            Remove-Item "$env:RUNNER_TEMP\runs" -Recurse -Force
          }
          function Listed { @(Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object DisplayName -eq 'Startline') }

          $p = Start-Process "dist\$base-setup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/ALLUSERS' -Wait -PassThru
          if ($p.ExitCode -or -not (Test-Path $exe)) { throw "setup.exe did not install" }
          Assert-Runs $exe
          if (-not (Test-Path "$env:ProgramFiles\Startline\LICENSE.txt")) { throw "setup.exe did not install the licence" }
          $p = Start-Process "$env:ProgramFiles\Startline\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          Start-Sleep -Seconds 5
          if ($p.ExitCode -or (Test-Path $exe)) { throw "setup.exe did not uninstall" }

          $msi = (Resolve-Path "dist\$base.msi").Path
          $p = Start-Process msiexec -ArgumentList '/i',"`"$msi`"",'/qn','/norestart','ALLUSERS=1' -Wait -PassThru
          if ($p.ExitCode -or -not (Test-Path $exe)) { throw "MSI did not install: $($p.ExitCode)" }
          Assert-Runs $exe
          if (-not (Test-Path "$env:ProgramFiles\Startline\LICENSE.txt")) { throw "MSI did not install the licence" }
          $menu = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs"
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut("$menu\Startline.lnk").TargetPath
          if ($target -ne $exe) { throw "The shortcut points to '$target'" }
          if ((Listed).Count -ne 1) { throw "Windows lists Startline $((Listed).Count) times" }
          $p = Start-Process msiexec -ArgumentList '/x',"`"$msi`"",'/qn','/norestart' -Wait -PassThru
          if ($p.ExitCode -or (Test-Path $exe) -or (Test-Path "$menu\Startline.lnk")) { throw "MSI did not uninstall: $($p.ExitCode)" }

          # For one account: in their own folder, without admin rights.
          $own = "$env:LOCALAPPDATA\Programs\Startline\startline.exe"
          $p = Start-Process msiexec -ArgumentList '/i',"`"$msi`"",'/qn','/norestart','ALLUSERS=2','MSIINSTALLPERUSER=1' -Wait -PassThru
          if ($p.ExitCode -or -not (Test-Path $own)) { throw "MSI did not install for one account: $($p.ExitCode)" }
          Assert-Runs $own
          $p = Start-Process msiexec -ArgumentList '/x',"`"$msi`"",'/qn','/norestart','ALLUSERS=2','MSIINSTALLPERUSER=1' -Wait -PassThru
          if ($p.ExitCode -or (Test-Path $own)) { throw "MSI did not uninstall for one account: $($p.ExitCode)" }

          # A chosen folder, without any screens.
          $dir = 'C:\Apps\Startline Test'
          $p = Start-Process msiexec -ArgumentList '/i',"`"$msi`"",'/qn','/norestart','ALLUSERS=1',"APPLICATIONFOLDER=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -or -not (Test-Path "$dir\startline.exe")) { throw "MSI did not install into a chosen folder: $($p.ExitCode)" }
          $p = Start-Process msiexec -ArgumentList '/x',"`"$msi`"",'/qn','/norestart' -Wait -PassThru
          if ($p.ExitCode -or (Test-Path "$dir\startline.exe")) { throw "MSI did not uninstall from a chosen folder: $($p.ExitCode)" }

          # Uninstalling takes away the Start with Windows entry it would otherwise leave pointing at nothing.
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $p = Start-Process msiexec -ArgumentList '/i',"`"$msi`"",'/qn','/norestart','ALLUSERS=2','MSIINSTALLPERUSER=1' -Wait -PassThru
          if ($p.ExitCode) { throw "MSI did not install for one account: $($p.ExitCode)" }
          Set-ItemProperty $run -Name Startline -Value "`"$own`" --background"
          $p = Start-Process msiexec -ArgumentList '/x',"`"$msi`"",'/qn','/norestart','ALLUSERS=2','MSIINSTALLPERUSER=1' -Wait -PassThru
          if ($p.ExitCode) { throw "MSI did not uninstall for one account: $($p.ExitCode)" }
          if ($null -ne (Get-ItemProperty $run -Name Startline -ErrorAction SilentlyContinue)) { throw "Uninstalling left Startline starting with Windows" }

          # Installing over the published release has to replace it, for this PC and for one account alike.
          New-Item -ItemType Directory old | Out-Null
          gh release download --repo "$env:GITHUB_REPOSITORY" --pattern 'startline-*.msi' --dir old 2>$null
          $previous = Get-ChildItem old -Filter *.msi | Select-Object -First 1
          if ($previous) {
            foreach ($scope in @(@('ALLUSERS=1'), @('ALLUSERS=2', 'MSIINSTALLPERUSER=1'))) {
              $installed = if ($scope.Count -eq 1) { $exe } else { $own }
              $p = Start-Process msiexec -ArgumentList (@('/i', "`"$($previous.FullName)`"", '/qn', '/norestart') + $scope) -Wait -PassThru
              if ($p.ExitCode) { throw "The published MSI did not install: $($p.ExitCode)" }
              $p = Start-Process msiexec -ArgumentList (@('/i', "`"$msi`"", '/qn', '/norestart') + $scope) -Wait -PassThru
              if ($p.ExitCode) { throw "MSI did not upgrade: $($p.ExitCode)" }
              if ((Listed).Count -ne 1) { throw "After upgrading ($scope), Windows lists Startline $((Listed).Count) times" }
              if ((Listed)[0].DisplayVersion -ne $env:VERSION) { throw "After upgrading ($scope), Windows lists version $((Listed)[0].DisplayVersion)" }
              $p = Start-Process msiexec -ArgumentList (@('/x', "`"$msi`"", '/qn', '/norestart') + $scope) -Wait -PassThru
              if ($p.ExitCode -or (Test-Path $installed)) { throw "MSI did not uninstall after upgrading ($scope): $($p.ExitCode)" }
            }
          } else {
            "No published MSI yet, so there's nothing to upgrade from"
          }
          $global:LASTEXITCODE = 0

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: dist/*
          if-no-files-found: error

  release:
    if: inputs.publish
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.windows.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          # A version can't change once it's out.
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$VERSION is already released. Raise the version in Cargo.toml."
            exit 1
          fi
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          # An upload can fail while GitHub is having trouble, so start over from a clean slate a few times.
          for attempt in 1 2 3 4; do
            gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Startline v$VERSION" --generate-notes "${flags[@]}" && exit 0
            sleep 60
            gh release delete "v$VERSION" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          done
          exit 1
